services:
  rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # stdio MCP server: launched per client session with
  #   docker compose run --rm -T mcp-server
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: fastapi-docs-mcp
    profiles: ["mcp"]
    environment:
      - RAG_SERVICE_URL=http://rag-api:8000
    depends_on:
      rag-api:
        condition: service_healthy